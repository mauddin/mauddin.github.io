# Rendered by _pages/gallery.md on /gallery/.
#
# To add a photo:
#   1. Put the image in assets/img/gallery/ (jpg or png; any size, phone photos are fine).
#      Name it YYYY-MM-short-slug.jpg so the folder stays sorted.
#   2. Add an entry below. Order does not matter: the page sorts newest first
#      and builds the year headings from `date`.
#
# Fields:
#   date:   required. YYYY-MM-DD (use 01 if the day is unknown). Shown as "Mon YYYY".
#   title:  required. Short caption, about 8 words.
#   image:  required. File name inside assets/img/gallery/.
#   place:  optional. City, ST (or City, Country).
#   credit: optional. Shown as "Photo: <credit>".
#   link:   optional. Source page; the credit links here.
#   alt:    optional. Describes the image for screen readers; defaults to the title.
#   focus:  optional. Part of the image kept when the 3:2 thumbnail crops it:
#           top, bottom, left, right, or center (default).
#   fit:    optional. "contain" shows the whole image in the thumbnail (no cropping).
#   video:  optional. true adds a play badge; the card opens `link` instead of the lightbox.

